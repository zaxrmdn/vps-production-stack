name: Deploy Finance App to VPS

on:
  push:
    branches: [ "main" ]
    paths:
      - 'finance-app/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up SSH Key
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Remote Host to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts

    - name: Deploy Finance App via SSH
      env:
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_IP: ${{ secrets.VPS_IP }}
      run: |
        ssh $VPS_USER@$VPS_IP "mkdir -p /opt/vps-stack/finance-app"
        scp -r finance-app/* $VPS_USER@$VPS_IP:/opt/vps-stack/finance-app/
        ssh $VPS_USER@$VPS_IP << 'EOF'
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
          cd /opt/vps-stack/finance-app
          docker compose -f docker-compose.finance.yml build
          docker compose -f docker-compose.finance.yml up -d --remove-orphans
        EOF
